services:
  postgres:
    image: postgres:16
    container_name: achat_postgres
    restart: always
    environment:
      POSTGRES_DB: achatdb
      POSTGRES_USER: achat_user
      POSTGRES_PASSWORD: achat_pass
    ports:
      - "5433:5432"
    volumes:
      - achat_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: achat_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      - postgres

volumes:
  achat_postgres_data: