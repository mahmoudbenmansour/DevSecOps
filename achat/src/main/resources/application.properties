# http://localhost:8089/SpringMVC/

# Server configuration
server.servlet.context-path=/SpringMVC
server.port=8089

### DATABASE ###
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/achatdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:achat_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:achat_pass}

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging configuration
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework=INFO
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{60} - %msg%n

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true